name: Suggest an MCP server
description: Propose a server for inclusion in the catalog
title: "Add: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, confirm the server meets the criteria in
        [CONTRIBUTING.md](https://github.com/mcpHQ/awesome-mcp-servers/blob/main/CONTRIBUTING.md).

  - type: input
    id: name
    attributes:
      label: Server name
      placeholder: Example MCP Server
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Project URL
      description: Link to the primary repository, documentation, or registry page.
      placeholder: https://github.com/example/example-mcp-server
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: In one factual sentence, explain what the server enables.
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Company, organization, maintainer, or Community.
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Primary implementation language
      placeholder: TypeScript
    validations:
      required: true

  - type: dropdown
    id: official
    attributes:
      label: Is this an official or vendor-backed server?
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Source repository
      description: GitHub or other source repo, if the project URL is a docs or marketing page. Use https://github.com/owner/name, not a /tree/ or /blob/ path.
      placeholder: https://github.com/example/example-mcp-server

  - type: dropdown
    id: license
    attributes:
      label: License
      description: Leave Unknown unless the project states it.
      options:
        - Unknown
        - MIT
        - Apache-2.0
        - BSD-2-Clause
        - BSD-3-Clause
        - ISC
        - MPL-2.0
        - GPL-3.0
        - AGPL-3.0
        - Unlicense
        - source-available
        - proprietary

  - type: dropdown
    id: pricing
    attributes:
      label: Pricing
      description: What it costs to use the server, not the repo license. Leave Unknown unless the project states it.
      options:
        - Unknown
        - free
        - freemium
        - paid

  - type: checkboxes
    id: transport
    attributes:
      label: Transport
      description: Select every way a client can run it.
      options:
        - label: stdio (local)
        - label: streamable-http (remote)
        - label: sse (remote)

  - type: input
    id: install
    attributes:
      label: Local install
      description: Command and package, if known. Example, npx @example/mcp-server or uvx example-mcp.
      placeholder: npx @example/mcp-server

  - type: checkboxes
    id: auth
    attributes:
      label: Auth
      description: Select every way a client can authenticate. none means a usable path needs no credential.
      options:
        - label: none
        - label: api-key
        - label: oauth

  - type: input
    id: verified
    attributes:
      label: Last checked
      description: UTC date you confirmed the server is still maintained, as YYYY-MM-DD. Leave blank if you have not checked.
      placeholder: "2026-11-02"

  - type: textarea
    id: evidence
    attributes:
      label: MCP support and maintenance evidence
      description: Link to MCP setup documentation and recent maintenance activity.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched the catalog and confirmed this is not a duplicate.
          required: true
        - label: The project has a verifiable source or installation path.
          required: true
