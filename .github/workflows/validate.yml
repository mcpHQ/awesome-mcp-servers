name: Validate catalog

on:
  pull_request:
    paths:
      - ".github/workflows/validate.yml"
      - ".githooks/**"
      - "data/**"
      - "scripts/**"
      - "*.md"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate catalog data
        run: npm run validate

      - name: Verify generated README
        run: npm run check-generated

      - name: Check changed links
        env:
          LINK_CHECK_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: npm run check-links -- --changed "$LINK_CHECK_RANGE"
