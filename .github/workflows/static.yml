name: Deploy website to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress production deploy finish; skip runs queued behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Refresh logos
        run: npm run fetch-logos
        continue-on-error: true
      - name: Build site
        run: npm run build-site
        env:
          SITE_URL: https://mcphq.org
      - name: Upload build folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
